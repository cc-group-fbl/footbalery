name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - "www/**"
      - "assets/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase for Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()
          marker = "dependencies {"
          if "com.google.gms:google-services" not in text:
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in android/build.gradle")
              text = text.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in text:
              text += "\n" + plugin + "\n"
              app.write_text(text)
          PY

      - name: Prepare launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/1794096538714.jpg")
          target = Path("assets/icon.png")
          if not source.exists():
              raise SystemExit(f"Icon source not found: {source}")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          image.save(target, format="PNG", optimize=True)
          print(f"Prepared {target} from {source}: {image.size}")
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android biometric permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.USE_BIOMETRIC" />'
          if permission not in text:
              marker = '<application'
              if marker not in text:
                  raise SystemExit("Could not find application tag in AndroidManifest.xml")
              text = text.replace(marker, permission + "\n    " + marker, 1)
              manifest.write_text(text)
          PY

      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/footbalery-upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "signingConfigs {" not in text:
              block = """
              signingConfigs {
                  release {
                      storeFile file("footbalery-upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
              text = text.replace("    buildTypes {", block + "\\n    buildTypes {", 1)
          pattern = r"(buildTypes\\s*\\{\\s*release\\s*\\{)"
          if not re.search(pattern, text):
              raise SystemExit("Could not locate release build type in android/app/build.gradle")
          text = re.sub(pattern, r"\\1\\n            signingConfig signingConfigs.release", text, count=1)
          app.write_text(text)
          PY

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: footbalery-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: footbalery-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
