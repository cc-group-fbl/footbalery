name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - "www/**"
      - "assets/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase for Android
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()
          marker = "dependencies {"
          if "com.google.gms:google-services" not in text:
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in android/build.gradle")
              text = text.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in text:
              text += "\n" + plugin + "\n"
              app.write_text(text)
          PY

      - name: Prepare launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/1794096538714.jpg")
          target = Path("assets/icon.png")
          if not source.exists():
              raise SystemExit(f"Icon source not found: {source}")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          image.save(target, format="PNG", optimize=True)
          print(f"Prepared {target} from {source}: {image.size}")
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: footbalery-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
