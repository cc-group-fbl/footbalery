<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открываем раздел — ФУТБОЛЁРЫ</title>
<script>
(function(){
  var projectBase='/footbalery';
  var path=window.location.pathname;
  var route=(path===projectBase||path===projectBase+'/'||path.indexOf(projectBase+'/')===0)
    ? path
    : projectBase+(path.charAt(0)==='/'?path:'/'+path);
  var target=route+window.location.search+window.location.hash;
  window.location.replace(projectBase+'/?__route='+encodeURIComponent(target));
})();
</script>
</head>
<body style="margin:0;background:#07090e;color:#fff;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center">
<p>Открываем нужный раздел приложения…</p>
</body>
</html>
